[pytest]
# Silence the asyncio default fixture loop scope deprecation warning.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Show short test summary for all failures and errors.
addopts = -v --tb=short

# Test discovery
testpaths = tests

# Treat all asyncio warnings as warnings (not errors) during the hackathon.
filterwarnings = ignore::DeprecationWarning:pytest_asyncio
